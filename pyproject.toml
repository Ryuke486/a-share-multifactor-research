[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-multifactor"
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "baostock>=0.9.3",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "polars>=1.30",
  "pyyaml>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
ashare-mvp = "ashare_multifactor.research.mvp:main"
ashare-factors = "ashare_multifactor.cli.factors:main"
ashare-combine = "ashare_multifactor.cli.combinations:main"
ashare-backtest = "ashare_multifactor.cli.formal_backtest:main"
ashare-validation = "ashare_multifactor.cli.validation:main"
ashare-robustness = "ashare_multifactor.cli.robustness:main"
ashare-delivery = "ashare_multifactor.cli.delivery:main"
ashare-supplements = "ashare_multifactor.cli.supplements:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
