[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-multifactor"
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "baostock>=0.9.3",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "polars>=1.30",
  "pyyaml>=6.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
ashare-mvp = "ashare_multifactor.research.mvp:main"
ashare-factors = "ashare_multifactor.cli.factors:main"
ashare-combine = "ashare_multifactor.cli.combinations:main"
ashare-backtest = "ashare_multifactor.cli.formal_backtest:main"
ashare-validation = "ashare_multifactor.cli.validation:main"
ashare-robustness = "ashare_multifactor.cli.robustness:main"
ashare-delivery = "ashare_multifactor.cli.delivery:main"
ashare-supplements = "ashare_multifactor.cli.supplements:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Chinese punctuation in strings, docstrings and comments is intended
  "RUF043",  # pytest.raises(match=...) patterns are plain substrings here
  "RUF005",  # tuple concatenation reads better than unpacking in the spec tables
  "B905",    # zip() strictness is decided per call site, not globally
  "B007", "RUF059", "RUF046",  # harmless unused loop/unpack names and explicit int() casts
  "SIM105", "SIM108", "SIM117",  # explicit try/except, if/else and nested with are kept for clarity
  "RUF022",  # __all__ of the release lifecycle is ordered by workflow, pinned by a test
  "UP042",   # str-mixin enums are part of serialized contracts
]
